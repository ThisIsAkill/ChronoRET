name: Byte-exact match check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  readability:
    name: Readability standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Without the ROM the header checks that need it (callers) are skipped
      # here and run in the match job below.
      - name: Lint (functions outside tools/readability_baseline.txt must be clean)
        run: python3 tools/lint_readability.py
      - name: Validate the review log
        run: python3 tools/validate_functions.py
      - name: Generated files stay untracked, docs carry no generated numbers
        run: python3 tools/progress.py --check
      # The data layer without assets: the manifest is what
      # tools/extract_data.py makes from the survey, asm/data/ matches it
      # (the pointer tables' entries are compared in the match job), the
      # lint's planted-read tests, and the text encoder on synthetic strings.
      - name: Data layer manifest and placement (no ROM)
        run: |
          python3 tools/extract_data.py check
          python3 tools/test_data_layer.py
          python3 tools/test_text.py
          python3 tools/test_records.py
          python3 tools/test_events.py
          python3 tools/test_battle.py
          python3 tools/test_scripts.py
          python3 tools/test_maps.py
          python3 tools/test_graphics.py
          python3 tools/test_sprites.py
          python3 tools/test_anims.py
          python3 tools/test_drawlists.py

  match:
    name: Reassemble and diff
    runs-on: ubuntu-latest
    # tools/isolated.py's check of the files asar opens is mandatory here
    # (strace is installed below); locally it is skipped with a warning
    # where strace is missing.
    env:
      CHRONORET_REQUIRE_STRACE: '1'

    steps:
      - uses: actions/checkout@v4

      # The expected SHA-256 of the US 1.0 ROM lives in rom.sha256 (in
      # `sha256sum` format). It is checked first, with or without the ROM, so
      # a missing or malformed hash file fails the job instead of silently
      # skipping the comparison.
      - name: Check the expected ROM hash file
        run: |
          if ! grep -qE '^[0-9a-f]{64}  roms/chrono_trigger\.sfc$' rom.sha256 2>/dev/null \
             || [ "$(wc -l < rom.sha256)" -ne 1 ]; then
            echo "::error::rom.sha256 is missing or malformed; it must hold one line: '<sha256>  roms/chrono_trigger.sfc'."
            exit 1
          fi

      # The ROM comes from the private repository ThisIsAkill/ct-rom, read
      # with the ROM_TOKEN secret (a fine-grained token with read-only
      # Contents access to that one repository). A GitHub secret cannot hold
      # the ROM itself: secrets are capped at 48 KB. Pull requests from forks
      # get no secrets, so there the check is skipped. How to set it up:
      # https://thisisakill.github.io/Kajar-site/CI_SETUP/
      - name: Fetch the ROM from the private repository
        env:
          ROM_TOKEN: ${{ secrets.ROM_TOKEN }}
          ROM_URL: https://api.github.com/repos/ThisIsAkill/ct-rom/contents/Chrono%20Trigger%20(USA).sfc
        run: |
          mkdir -p roms
          if [ -z "$ROM_TOKEN" ]; then
            echo "::warning::ROM_TOKEN secret not set — skipping byte-exact check."
            echo "SKIP_CHECK=1" >> "$GITHUB_ENV"
          else
            if ! curl -fsSL -H "Authorization: Bearer $ROM_TOKEN" \
                 -H "Accept: application/vnd.github.raw" \
                 -o roms/chrono_trigger.sfc "$ROM_URL"; then
              echo "::error::Could not fetch the ROM from ThisIsAkill/ct-rom (check ROM_TOKEN's access)."
              exit 1
            fi
            if ! sha256sum --check --strict rom.sha256; then
              echo "::error::ROM checksum mismatch (got $(sha256sum roms/chrono_trigger.sfc | cut -d' ' -f1), expected $(cut -d' ' -f1 rom.sha256))"
              exit 1
            fi
          fi

      - name: Install asar
        if: env.SKIP_CHECK != '1'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake build-essential strace
          git clone --depth=1 --branch v1.91 https://github.com/RPGHacker/asar.git /tmp/asar
          cmake -S /tmp/asar/src -B /tmp/asar/build
          cmake --build /tmp/asar/build --target asar-standalone
          sudo cp /tmp/asar/build/asar/bin/asar /usr/local/bin/asar
          asar --version

      - name: Set up Python
        if: env.SKIP_CHECK != '1'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check environment
        if: env.SKIP_CHECK != '1'
        run: python3 tools/check_env.py

      # The data the source does not emit comes from the ROM, extracted
      # into the ignored build/assets/ (never committed); the build then
      # assembles from the source and those assets onto a blank image.
      - name: Extract the data layer's assets from the ROM
        if: env.SKIP_CHECK != '1'
        run: python3 tools/extract_data.py extract

      - name: Build and diff
        if: env.SKIP_CHECK != '1'
        run: |
          make diff
          echo "MATCH_RESULT=passed" >> "$GITHUB_ENV"

      - name: Verify full coverage (every source-emitted byte)
        if: env.SKIP_CHECK != '1'
        run: |
          python3 tools/verify.py

      # symbols/functions.csv and progress.json are not tracked: regenerate
      # them from the source, then check everything against them.
      - name: Regenerate symbols/ from the source
        if: env.SKIP_CHECK != '1'
        run: |
          python3 tools/progress.py --update

      - name: Lint with the ROM (header and caller checks)
        if: env.SKIP_CHECK != '1'
        run: |
          python3 tools/lint_readability.py

      - name: Tool tests (xref verdicts, the lint's INDEX rule)
        if: env.SKIP_CHECK != '1'
        run: |
          make test-tools

      - name: Validate symbols/ (statuses and the review log)
        if: env.SKIP_CHECK != '1'
        run: |
          python3 tools/validate_functions.py

      - name: Generated files stay untracked
        if: env.SKIP_CHECK != '1'
        run: |
          python3 tools/progress.py --check

      - name: Fail on mismatch
        if: env.SKIP_CHECK != '1' && env.MATCH_RESULT != 'passed'
        run: |
          echo "::error::make diff failed — reassembled ROM does not match original."
          exit 1
